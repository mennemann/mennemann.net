<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="title" content="Marcin Mennemann" />
        <meta name="description" content="Hi, I'm Marcin, Computer science student at TU Dortmund. Welcome to my Website!" />
        <meta name="keywords" content="Marcin, Mennemann" />
        <meta name="robots" content="index, follow" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="language" content="English" />

        <title>Hi, I'm Marcin</title>

        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <link rel="stylesheet" href="style/style.css" />
        <link rel="stylesheet" href="style/header.css" />
        <link rel="stylesheet" href="style/popup.css" />
    </head>

    <body>
        <div id="content">
            <div id="header">
                <div id="profile">
                    <img id="pfp" src="./assets/pfp.jpg" alt="profile picture" />
                    <div class="flex-spacer"></div>
                    <h1 id="name">Marcin <br id="name_break" />Mennemann</h1>
                    <h2 id="description"><span id="age"></span> years old</h2>
                </div>

                <div id="socials">
                    <img src="./assets/email-white.svg" alt="email icon" style="scale: 1.2" onclick="show_mail()" />
                    <img src="./assets/x-logo-white.svg" alt="twitter icon" onclick="newTab('https://x.com/mxrcin12')" />
                    <img src="./assets/discord-mark-white.svg" alt="discord icon" onclick="newTab('https://discord.com/users/243402586349109248')" />
                    <img src="./assets/github-mark-white.svg" alt="github icon" onclick="newTab('https://github.com/mennemann')" />
                </div>
            </div>

            <div class="line"></div>

            <div>
                <div id="markdown"></div>

                <h3>Timeline 📅</h3>
                <dl>
                    <dt><b>2021 - now</b>:&ensp;</dt>
                    <dd>Computer science student at TU Dortmund</dd>
                    <dd>2nd level support at Kostal</dd>
                </dl>

                <h3 id="contact">Contact me 📫</h3>
                <p>
                    You can find my contact info by clicking on one of the buttons at the
                    <span onclick="scroll_to_el('socials', 70)" class="link">top of the page</span> :D
                </p>
            </div>

            <div class="line" style="margin-top: 35px"></div>
            <div style="margin: 15px 0 0 auto; width: fit-content">&copy; Marcin Mennemann</div>
        </div>

        <!-- Replace with dialog-->
        <div id="popup">
            <div id="popup_box_email" class="popup_box">
                <div class="popup_header">
                    <span class="popup_title"> Email Address </span>
                    <img src="./assets/close.svg" alt="close icon" style="margin-left: auto; scale: 0.9" onclick="close_popup()" />
                </div>
                <div class="line"></div>
                <div class="popup_content">
                    <input id="popup_email_field" type="text" value="marcin@mennemann.net" readonly />
                    <img src="./assets/copy.png" alt="copy icon" class="copy_icon" onclick="copy_input_field('popup_email_field')" />
                </div>
            </div>
        </div>

        <script src="script.js" defer></script>
        <script>
            window.onload = () => {
                const birthday = new Date("07/12/2003");

                document.getElementById("age").innerText = Math.abs(new Date(Date.now() - birthday.getTime()).getUTCFullYear() - 1970);
            };

            fetch("https://raw.githubusercontent.com/mennemann/mennemann.net/main/README.md")
                .then((res) => res.text())
                .then((markdown) => {
                    document.getElementById("markdown").innerHTML = marked.parse(markdown);
                });
        </script>
    </body>
</html>
